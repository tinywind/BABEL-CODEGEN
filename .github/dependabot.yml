version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "03:00"
    timezone: Asia/Phnom_Penh
  open-pull-requests-limit: 5
  commit-message:
    prefix: chore
    include: scope
- package-ecosystem: gradle
  directory: /babel-codegen-gradle-plugin
  schedule:
    interval: weekly
    day: monday
    time: "03:00"
    timezone: Asia/Phnom_Penh
  open-pull-requests-limit: 5
  commit-message:
    prefix: chore
    include: scope
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: maven
  directory: /
  ignore:
  - dependency-name: org.glassfish.jaxb:jaxb-runtime
    # Retain the public javax.xml.bind configuration model.
    versions: ["[3.0,)"]
  - dependency-name: com.github.jaxb-xew-plugin:jaxb-xew-plugin
    # Upstream marks 1.11 invalid; 2.x requires Jakarta.
    versions: ["1.11", "[2.0,)"]
  schedule:
    interval: weekly
    day: monday
    time: "03:00"
    timezone: Asia/Phnom_Penh
  open-pull-requests-limit: 5
  commit-message:
    prefix: chore
    include: scope
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
